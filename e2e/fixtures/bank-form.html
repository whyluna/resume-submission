<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>某某银行 2027 届校园招聘申请表（本地测试页）</title>
<style>
  body { font: 14px/1.8 -apple-system, "PingFang SC", sans-serif; color: #1f2937; max-width: 880px; margin: 24px auto; background: #f8fafc; padding: 0 16px }
  form, .card { background: #fff; border-radius: 12px; padding: 20px 26px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06) }
  h2 { font-size: 16px; border-left: 4px solid #4f46e5; padding-left: 10px; margin: 0 0 14px }
  .row { display: flex; flex-wrap: wrap; gap: 12px 22px }
  .item { display: flex; align-items: center; gap: 8px; min-width: 250px }
  .item label { width: 96px; text-align: right; color: #4b5563; flex: none }
  .item input[type=text], .item input[type=date], .item input[type=month], .item select, .item textarea {
    flex: 1; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit }
  .item.radio label { width: auto; text-align: left }
  textarea { width: 100%; min-height: 90px; font: inherit; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px }
  .req::after { content: " *"; color: #ef4444 }
  .slot { border: 1px dashed #e5e7eb; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px }
  .empty-hint { color: #9ca3af; font-size: 13px; padding: 10px 2px }
  /* antd cascader（省市级联，与真实银行表单一致） */
  .ant-cascader-input { border: 1px solid #d1d5db; border-radius: 6px; height: 30px; padding: 0 10px; width: 190px; font: inherit; font-size: 13px; background: #fff }
  .ant-cascader-menus { position: absolute; z-index: 1050; display: flex; gap: 4px; background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.1); padding: 4px }
  .ant-cascader-menu { min-width: 100px; list-style: none; margin: 0; padding: 4px }
  .ant-cascader-menu-item { padding: 5px 10px; font-size: 13px; border-radius: 4px; cursor: pointer }
  .ant-cascader-menu-item:hover { background: #f5f5f5 }
  button.add { border: 1px dashed #4f46e5; color: #4f46e5; background: #eef2ff; border-radius: 8px; padding: 7px 18px; cursor: pointer; font: inherit }
  .actions { text-align: center; margin: 24px 0 }
  .submit { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 10px 42px; font-size: 15px; cursor: pointer }
  .note { color: #9ca3af; font-size: 12px }
</style>
</head>
<body>
<h1 style="font-size:20px">某某银行 2027 届校园招聘 · 网申申请表</h1>
<p class="note">本地测试页：验证插件扫描/匹配/填写/多条目添加。多条目分区默认为空，点「添加」出现填写框（与 Moka 等真实系统一致）。红色「提交申请表」插件永远不会点击。</p>

<form id="applyForm" onsubmit="return false">
  <div class="card">
    <h2>基本信息</h2>
    <div class="row">
      <div class="item"><label class="req" for="f_name">姓名</label><input type="text" id="f_name" required></div>
      <div class="item radio"><label class="req">性别</label>
        <label><input type="radio" name="gender" value="1">男</label>
        <label><input type="radio" name="gender" value="2">女</label>
      </div>
      <div class="item"><label class="req" for="f_birth">出生年月</label><input type="date" id="f_birth"></div>
      <div class="item"><label for="f_nation">民族</label>
        <select id="f_nation"><option value="">请选择</option><option>汉族</option><option>壮族</option><option>回族</option><option>满族</option><option>其他</option></select></div>
      <div class="item"><label class="req" for="f_pol">政治面貌</label>
        <select id="f_pol"><option value="">请选择</option><option>中共党员</option><option>中共预备党员</option><option>共青团员</option><option>群众</option><option>民主党派</option></select></div>
      <div class="item"><label for="f_id">身份证号码</label><input type="text" id="f_id" maxlength="18"></div>
      <div class="item"><label class="req" for="f_phone">手机号码</label><input type="text" id="f_phone"></div>
      <div class="item"><label class="req" for="f_email">电子邮箱</label><input type="text" id="f_email"></div>
      <div class="item"><label for="f_jg">籍贯</label>
        <div class="ant-cascader" id="f_jg_cas"><input type="text" readonly class="ant-cascader-input" placeholder="请选择省 / 市"></div></div>
      <div class="item"><label for="f_growth">成长故乡</label><input type="text" id="f_growth" placeholder="祖辈长期居住地"></div>
      <div class="item"><label for="f_hk">户籍所在地</label>
        <div class="ant-cascader" id="f_hk_cas"><input type="text" readonly class="ant-cascader-input" placeholder="请选择省 / 市"></div></div>
      <div class="item"><label for="f_city">现居住城市</label>
        <div class="ant-cascader" id="f_city_cas"><input type="text" readonly class="ant-cascader-input" placeholder="请选择省 / 市"></div></div>
      <div class="item"><label for="f_height">身高(cm)</label><input type="text" id="f_height"></div>
      <div class="item radio"><label>婚姻状况</label>
        <label><input type="radio" name="marital" value="0">未婚</label>
        <label><input type="radio" name="marital" value="1">已婚</label>
      </div>
      <div class="item"><label>近期免冠照</label><input type="file" accept="image/*"></div>
    </div>
  </div>

  <div class="card">
    <h2>教育经历（从低到高填写）</h2>
    <div id="eduSlots"></div>
    <button type="button" class="add" onclick="addSlot('eduSlots','tpl-edu')">＋ 添加教育经历</button>
  </div>

  <div class="card">
    <h2>实习经历</h2>
    <div id="internSlots"></div>
    <button type="button" class="add" onclick="addSlot('internSlots','tpl-intern')">＋ 添加实习经历</button>
  </div>

  <div class="card">
    <h2>项目经历</h2>
    <div id="projSlots"></div>
    <button type="button" class="add" onclick="addSlot('projSlots','tpl-proj')">＋ 添加项目经历</button>
  </div>

  <div class="card">
    <h2>科研成果/论文</h2>
    <div id="paperSlots"></div>
    <button type="button" class="add" onclick="addSlot('paperSlots','tpl-paper')">＋ 添加科研成果/论文</button>
  </div>

  <div class="card">
    <h2>奖惩情况</h2>
    <div id="awardSlots"></div>
    <button type="button" class="add" onclick="addSlot('awardSlots','tpl-award')">＋ 添加奖项</button>
  </div>

  <div class="card">
    <h2>家庭成员及社会关系</h2>
    <div id="familySlots"></div>
    <button type="button" class="add" onclick="addSlot('familySlots','tpl-family')">＋ 添加家庭成员</button>
  </div>

  <div class="card">
    <h2>语言能力</h2>
    <div class="row">
      <div class="item"><label>英语等级</label>
        <select id="lang_cert"><option value="">请选择</option><option>CET-4</option><option>CET-6</option><option>专业四级</option><option>专业八级</option><option>托福</option><option>雅思</option><option>无</option></select></div>
      <div class="item"><label>分数</label><input type="text" id="lang_score"></div>
    </div>
  </div>

  <div class="card">
    <h2>求职意向</h2>
    <div class="row">
      <div class="item"><label class="req">期望工作城市</label><input type="text" id="in_city"></div>
      <div class="item"><label>期望岗位</label><input type="text" id="in_pos"></div>
      <div class="item"><label>期望年薪(万)</label><input type="text" id="in_salary" placeholder="15-25"></div>
    </div>
  </div>

  <div class="card">
    <h2>自我评价</h2>
    <textarea id="self_eval" maxlength="500" placeholder="请简要介绍个人优势（500字内）"></textarea>
  </div>

  <div class="card">
    <h2>开放性问题</h2>
    <label style="color:#4b5563">请谈谈你为什么选择报考我行？（300字以上）</label>
    <textarea id="oq_why" style="margin-top:6px"></textarea>
  </div>

  <div class="actions">
    <button type="button" class="submit" onclick="alert('演示页：不会真的提交')">提交申请表</button>
  </div>
</form>

<template id="tpl-edu">
  <div class="slot edu-slot">
    <div class="row">
      <div class="item"><label class="req">学校名称</label><input type="text" class="edu_school"></div>
      <div class="item"><label>学院</label><input type="text" class="edu_college"></div>
      <div class="item"><label class="req">专业</label><input type="text" class="edu_major"></div>
      <div class="item"><label>学历</label>
        <select class="edu_edu"><option value="">请选择</option><option>博士研究生</option><option>硕士研究生</option><option>本科</option><option>专科</option></select></div>
      <div class="item"><label>学位</label>
        <select class="edu_degree"><option value="">请选择</option><option>博士</option><option>硕士</option><option>学士</option><option>无</option></select></div>
      <div class="item"><label>入学时间</label><input type="month" class="edu_start"></div>
      <div class="item"><label>毕业时间</label><input type="month" class="edu_end"></div>
      <div class="item"><label>学习方式</label>
        <select class="edu_mode"><option value="">请选择</option><option>全日制</option><option>非全日制</option></select></div>
      <div class="item"><label>GPA/绩点</label><input type="text" class="edu_gpa"></div>
      <div class="item"><label>专业排名</label><input type="text" class="edu_rank" placeholder="前10%"></div>
    </div>
  </div>
</template>

<template id="tpl-intern">
  <div class="slot intern-slot">
    <div class="row">
      <div class="item"><label>实习单位</label><input type="text" class="it_company"></div>
      <div class="item"><label>实习岗位</label><input type="text" class="it_title"></div>
      <div class="item"><label>开始时间</label><input type="month" class="it_start"></div>
      <div class="item"><label>结束时间</label><input type="month" class="it_end"></div>
    </div>
    <div style="margin-top:8px"><label style="color:#4b5563">工作内容：</label><textarea class="it_desc" style="margin-top:4px"></textarea></div>
  </div>
</template>

<template id="tpl-proj">
  <div class="slot proj-slot">
    <div class="row">
      <div class="item"><label>项目名称</label><input type="text" class="pj_name"></div>
      <div class="item"><label>担任角色</label><input type="text" class="pj_role"></div>
      <div class="item"><label>开始时间</label><input type="month" class="pj_start"></div>
      <div class="item"><label>技术栈</label><input type="text" class="pj_stack"></div>
    </div>
    <div style="margin-top:8px"><label style="color:#4b5563">项目描述：</label><textarea class="pj_desc" style="margin-top:4px"></textarea></div>
  </div>
</template>

<template id="tpl-paper">
  <div class="slot paper-slot">
    <div class="row">
      <div class="item"><label>论文题目</label><input type="text" class="pp_title"></div>
      <div class="item"><label>发表期刊</label><input type="text" class="pp_venue"></div>
      <div class="item"><label>发表时间</label><input type="month" class="pp_date"></div>
      <div class="item"><label>作者排序</label>
        <select class="pp_order"><option value="">请选择</option><option>第一作者</option><option>第二作者</option><option>第三作者及以后</option></select></div>
    </div>
    <div style="margin-top:8px"><label style="color:#4b5563">论文介绍：</label><textarea class="pp_desc" style="margin-top:4px"></textarea></div>
  </div>
</template>

<template id="tpl-award">
  <div class="slot award-slot">
    <div class="row">
      <div class="item"><label>奖项名称</label><input type="text" class="aw_name"></div>
      <div class="item"><label>获奖级别</label>
        <select class="aw_level"><option value="">请选择</option><option>国家级</option><option>省级</option><option>市级</option><option>校级</option></select></div>
      <div class="item"><label>获奖时间</label><input type="month" class="aw_date"></div>
    </div>
  </div>
</template>

<template id="tpl-family">
  <div class="slot family-slot">
    <div class="row">
      <div class="item"><label>与本人关系</label>
        <select class="fm_rel"><option value="">请选择</option><option>父亲</option><option>母亲</option><option>配偶</option><option>兄弟姐妹</option></select></div>
      <div class="item"><label>姓名</label><input type="text" class="fm_name"></div>
      <div class="item"><label>工作单位</label><input type="text" class="fm_company"></div>
      <div class="item"><label>职务</label><input type="text" class="fm_pos"></div>
      <div class="item"><label>联系电话</label><input type="text" class="fm_phone"></div>
    </div>
  </div>
</template>

<script>
  // 真实 ATS 交互：分区默认为空，点「添加」按模板克隆出一个填写槽位
  function addSlot(containerId, tplId) {
    document.getElementById(containerId).appendChild(
      document.getElementById(tplId).content.cloneNode(true),
    )
  }

  // 省市级联（antd 风格：浮层逐级展开）
  const PROVINCE_CITY = {
    '北京市': ['北京市'],
    '广东省': ['广州市', '深圳市', '珠海市'],
    '湖北省': ['武汉市', '宜昌市'],
    '浙江省': ['杭州市', '宁波市'],
    '湖南省': ['长沙市'],
  }
  function setupCascader(id) {
    const root = document.getElementById(id)
    const input = root.querySelector('input')
    let panel = null
    input.addEventListener('click', () => {
      if (panel) { panel.remove(); panel = null; return }
      panel = document.createElement('div')
      panel.className = 'ant-cascader-menus'
      const r = root.getBoundingClientRect()
      panel.style.left = r.left + 'px'
      panel.style.top = (r.bottom + 4 + window.scrollY) + 'px'
      const col = document.createElement('ul')
      col.className = 'ant-cascader-menu'
      Object.keys(PROVINCE_CITY).forEach((p) => {
        const li = document.createElement('li')
        li.className = 'ant-cascader-menu-item'
        li.textContent = p
        li.addEventListener('click', (e) => {
          e.stopPropagation()
          panel.querySelectorAll('.ant-cascader-menu').forEach((m, i) => { if (i > 0) m.remove() })
          const cityCol = document.createElement('ul')
          cityCol.className = 'ant-cascader-menu'
          PROVINCE_CITY[p].forEach((c) => {
            const cli = document.createElement('li')
            cli.className = 'ant-cascader-menu-item'
            cli.textContent = c
            cli.addEventListener('click', (ev) => {
              ev.stopPropagation()
              input.value = p + ' / ' + c
              root.dataset.value = p + '/' + c
              panel.remove(); panel = null
            })
            cityCol.appendChild(cli)
          })
          panel.appendChild(cityCol)
        })
        col.appendChild(li)
      })
      panel.appendChild(col)
      document.body.appendChild(panel)
    })
  }
  setupCascader('f_jg_cas')
  setupCascader('f_hk_cas')
  setupCascader('f_city_cas')
</script>
</body>
</html>
