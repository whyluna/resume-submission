<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Kuma 脱敏真实结构</title></head>
<body>
  <main>
    <section class="kuma-resume-section">
      <div class="section-title">教育情况</div>
      <div class="kuma-education-card">
        <div class="kuma-uxform-field">
          <div class="kuma-uxform-field-label">学历</div>
          <div class="kuma-uxform-field-core">
            <div class="kuma-select2"><input class="kuma-select2-search__field" type="text"></div>
          </div>
        </div>
        <div class="kuma-uxform-field">
          <div class="kuma-uxform-field-label">时间</div>
          <div class="kuma-date-uxform-field-cascade">
            <input class="kuma-input" readonly placeholder="开始日期">
            <input class="kuma-input" readonly placeholder="结束日期">
          </div>
        </div>
        <div class="kuma-uxform-field">
          <div class="kuma-uxform-field-label">学校全称</div>
          <div class="kuma-uxform-field-core">
            <div class="kuma-select2"><input class="kuma-select2-search__field" type="text"></div>
          </div>
        </div>
      </div>
      <div class="kuma-add-action"><span>＋</span><span>添加教育情况</span></div>
      <button class="kuma-button">保存</button>
    </section>
    <section class="kuma-resume-section">
      <div class="section-title">实习/项目经历</div>
      <div class="kuma-experience-card">
        <div class="kuma-uxform-field"><div class="kuma-uxform-field-label">公司或组织名称</div><div class="kuma-uxform-field-core"><input class="kuma-input" placeholder="请输入"></div></div>
        <div class="kuma-uxform-field"><div class="kuma-uxform-field-label">工作描述</div><div class="kuma-uxform-field-core"><textarea class="kuma-textarea" placeholder="请输入"></textarea></div></div>
      </div>
      <div class="kuma-add-action"><span>＋</span><span>添加实习或项目情况</span></div>
      <button class="kuma-button">保存</button>
    </section>
    <button class="choose-job">去选择职位</button>
  </main>
</body>
</html>
