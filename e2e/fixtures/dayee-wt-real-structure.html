<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Dayee WT 脱敏真实结构</title></head>
<body>
  <main class="edit-resume-div">
    <section class="resume-section">
      <h2>教育经历</h2>
      <div class="education-entry">
        <div class="resume-row"><div class="field-title">开始时间</div><div class="ipt-item"><input class="dayType startDate" type="text" readonly></div></div>
        <div class="resume-row"><div class="field-title">结束时间</div><div class="ipt-item"><input class="dayType endDate" type="text" readonly></div></div>
        <div class="resume-row"><div class="field-title">学校名称</div><div class="ipt-item"><input type="text"></div></div>
        <div class="resume-row"><div class="field-title">学历</div><div class="ipt-item"><select class="selectpicker show-tick form-control"><option>请选择</option><option>本科</option><option>硕士研究生</option></select></div></div>
      </div>
      <a class="add-more" href="">+ 增加更多 教育经历</a>
      <button class="save-section">保 存</button>
    </section>
    <section class="resume-section">
      <h2>奖励荣誉</h2>
      <div class="award-entry">
        <div class="resume-row"><div class="field-title">奖励名称</div><div class="ipt-item"><input type="text"></div></div>
        <div class="resume-row"><div class="field-title">获奖时间</div><div class="ipt-item"><input class="dayType" type="text" readonly></div></div>
      </div>
      <a class="add-more" href="">+ 增加更多 奖励荣誉</a>
      <button class="save-section">保 存</button>
    </section>
    <button class="save-all">暂存并退出</button>
    <button class="submit-all">提交</button>
  </main>
</body>
</html>
