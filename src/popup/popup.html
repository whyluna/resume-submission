<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>秋招简历自动填写</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box }
      body { width: 340px; font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; padding: 14px }
      h1 { font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 10px }
      h1 .logo { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(180deg, #4f46e5, #2563eb) }
      .site { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f3f4f6; border-radius: 8px; margin-bottom: 10px }
      .site .name { font-weight: 600 }
      .site .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #eef2ff; color: #4f46e5 }
      .warn { font-size: 12px; color: #b45309; background: #fffbeb; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px }
      label { display: block; font-size: 12px; color: #6b7280; margin: 8px 0 4px }
      select { width: 100%; padding: 7px 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px }
      .btn { display: block; width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 10px;
             font-size: 14px; font-weight: 600; cursor: pointer; background: #4f46e5; color: #fff }
      .btn:hover { background: #4338ca }
      .btn:disabled { background: #c7d2fe; cursor: not-allowed }
      .btn.ghost { background: #fff; color: #4f46e5; border: 1px solid #c7d2fe; font-weight: 500 }
      .result { margin-top: 12px; padding: 10px; background: #f8fafc; border-radius: 10px }
      .counts { display: flex; gap: 5px; flex-wrap: wrap }
      .chip { padding: 2px 9px; border-radius: 999px; font-size: 12px }
      .ok { background: #dcfce7; color: #15803d } .re { background: #ffedd5; color: #c2410c }
      .fail { background: #fee2e2; color: #b91c1c } .un { background: #f3f4f6; color: #6b7280 } .man { background: #fef9c3; color: #a16207 }
      .list { margin-top: 8px; font-size: 12px; color: #6b7280; max-height: 120px; overflow: auto }
      .list div { padding: 2px 0; border-bottom: 1px dashed #e5e7eb }
      .foot { margin-top: 10px; text-align: center; font-size: 12px }
      .foot a { color: #4f46e5; text-decoration: none; cursor: pointer }
      .spin { display: inline-block; animation: r 1s linear infinite }
      @keyframes r { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
